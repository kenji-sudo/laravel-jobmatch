name: Laravel checks

on:
  push:
    branches: [feature/frontend, fix/laravel-readiness, feature/local-semantic-matching]
  pull_request:
    branches: [feature/frontend, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, curl, fileinfo
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare isolated test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Frontend tests and asset build
        run: |
          npm run test:ui
          npm run build
      - name: PHP test suite
        run: php artisan test
      - name: Validate Windows launcher syntax
        shell: pwsh
        run: |
          Get-ChildItem "$env:GITHUB_WORKSPACE/tools/*.ps1" | ForEach-Object {
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }

  local-model-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/local-semantic-matching'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, curl, fileinfo
          tools: composer:v2
          coverage: none
      - name: Prepare application
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
      - name: Install official local model server
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Download model and check actual application transport
        env:
          OLLAMA_HOST: 127.0.0.1:11434
        run: |
          ollama serve > "$RUNNER_TEMP/ollama-smoke.log" 2>&1 &
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags > /dev/null; then break; fi
            sleep 2
          done
          ollama pull all-minilm:22m-l6-v2-fp16
          php artisan matching:check
