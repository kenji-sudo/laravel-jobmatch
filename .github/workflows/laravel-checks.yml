name: Laravel checks

on:
  push:
    branches: [feature/frontend, fix/laravel-readiness]
  pull_request:
    branches: [feature/frontend, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, curl, fileinfo
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare isolated test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Frontend tests and asset build
        run: |
          npm run test:ui
          npm run build
      - name: PHP test suite
        run: php artisan test
